<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Notchline: a MacBook notch grown into an island, a prompt and a progress bar inside -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34373F"/>
      <stop offset="1" stop-color="#111216"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FD3A8"/>
      <stop offset="1" stop-color="#9DF5CB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8BF0BE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8BF0BE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- the tile, on the macOS icon grid -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>

  <g clip-path="url(#clip)">
    <!-- light spilling out of the island -->
    <ellipse cx="512" cy="300" rx="330" ry="120" fill="url(#glow)"/>

    <!-- faint lines of a log below -->
    <rect x="236" y="520" width="400" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.10"/>
    <rect x="236" y="590" width="300" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="236" y="660" width="460" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect x="236" y="730" width="250" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.06"/>

    <!-- the island: flat against the top, inward curves where it meets the edge -->
    <path d="M 214 100
             Q 244 100 244 130
             L 244 212
             Q 244 290 322 290
             L 702 290
             Q 780 290 780 212
             L 780 130
             Q 780 100 810 100
             Z" fill="#000000"/>
  </g>

  <!-- >_ -->
  <path d="M 300 166 L 344 196 L 300 226" fill="none" stroke="#8BF0BE"
        stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="362" y="214" width="54" height="20" rx="10" fill="#8BF0BE"/>

  <!-- progress -->
  <rect x="456" y="186" width="266" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="456" y="186" width="176" height="22" rx="11" fill="url(#progress)"/>

  <!-- a hairline on the tile's edge, as macOS icons have -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>
