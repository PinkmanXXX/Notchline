name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Universal build and DMG
    # the macOS 26 SDK: Liquid Glass and onGeometryChange; the app still runs on 14
    runs-on: macos-26
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: swift --version

      - name: Unit tests
        run: make test

      # the real app, real zsh sessions and `notch`, in a throwaway home;
      # hosted macOS runners have the GUI session the app needs
      - name: End-to-end tests
        run: make e2e

      # ---- optional signing identity; skipped when the secrets are absent ----
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Build universal app bundle
        run: make bundle

      - name: Verify both slices are present
        run: |
          for bin in Notchline notch; do
            lipo -archs Notchline.app/Contents/MacOS/$bin | tee archs.txt
            grep -q arm64  archs.txt || { echo "::error::arm64 slice missing in $bin";  exit 1; }
            grep -q x86_64 archs.txt || { echo "::error::x86_64 slice missing in $bin"; exit 1; }
          done

      - name: Sign
        if: env.SIGNED == '1'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --deep --options runtime --timestamp \
                   --sign "Developer ID Application: $TEAM_ID" Notchline.app
          codesign --verify --strict --verbose=2 Notchline.app

      - name: Pack DMG
        run: |
          rm -rf dmg && mkdir dmg
          cp -R Notchline.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Notchline -srcfolder dmg -ov -format UDZO Notchline.dmg

      - name: Notarise and staple
        if: env.SIGNED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit Notchline.dmg \
                --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
                --team-id "$TEAM_ID" --wait
          xcrun stapler staple Notchline.dmg

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Notchline.dmg
          body: |
            Для macOS 14 и новее, Apple Silicon и Intel.

            **Установка**

            Скачайте `Notchline.dmg` ниже и перетащите Notchline в «Программы».
            Сборка не подписана сертификатом Apple, поэтому при первом запуске
            откройте «Системные настройки → Конфиденциальность и безопасность»
            и нажмите «Всё равно открыть».

            Или одной командой — тогда этот шаг не нужен:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/PinkmanXXX/notchline/main/scripts/install.sh | bash
            ```

      - uses: actions/upload-artifact@v4
        with:
          name: Notchline-dmg
          path: Notchline.dmg
